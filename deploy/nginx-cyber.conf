# Cosmos Molorum Sentinel reverse proxy.
# Installed by deploy/install.sh to /etc/nginx/sites-available/cosmos-sentinel
# in cybersecurity mode, and alongside the panel in hosting mode.
# Public listener: 7999 by default.

server {
    listen @LISTEN_PORT@;
    listen [::]:@LISTEN_PORT@;
    server_name @SERVER_NAME@;

    root @APP_DIR@/cyber/web;
    index index.html;

    client_max_body_size 2m;
    client_body_timeout 60s;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location /assets/ {
        try_files $uri =404;
        expires 30d;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:7998;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 520s;
        proxy_send_timeout 520s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
