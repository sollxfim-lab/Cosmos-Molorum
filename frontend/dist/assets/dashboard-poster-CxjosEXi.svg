    <radialGradient id="cmp-planet" cx="0" cy="0" r="1" gradientTransform="translate(1054 128) rotate(58) scale(58)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e4d6ba"/>
      <stop offset=".55" stop-color="#c9a66f"/>
      <stop offset="1" stop-color="#8f6f45"/>
    </radialGradient>
    <linearGradient id="cmp-orbit" x1="690" y1="292" x2="1180" y2="246" gradientUnits="userSpaceOnUse">
